name: Recorder regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recording:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned Lua 5.1.5
        run: |
          curl --fail --location --output /tmp/lua.tar.gz https://www.lua.org/ftp/lua-5.1.5.tar.gz
          echo '2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333  /tmp/lua.tar.gz' | sha256sum --check
          tar -xzf /tmp/lua.tar.gz -C /tmp
          make -C /tmp/lua-5.1.5 generic
          echo 'FOREVERTOME_LUA=/tmp/lua-5.1.5/src/lua' >> "$GITHUB_ENV"
      - name: Run required regression gate
        run: python3 tools/test.py
      - name: Build distribution
        run: python3 tools/package.py
  windows-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Windows installation layout
        run: python -m unittest discover -s tests -p test_package.py
      - name: Build distribution
        run: python tools/package.py
      - name: Install standalone exporter build dependency
        run: python -m pip install -r requirements-exporter-build.txt
      - name: Build and smoke-test standalone exporter
        run: python tools/package_exporter.py
